name: Збірка APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "assets/**", "scripts/prepare-www.mjs", "scripts/customize-android.mjs", "capacitor.config.json", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Встановлення залежностей
        run: npm install --no-audit --no-fund

      - name: Підготовка застосунку
        run: node scripts/prepare-www.mjs

      - name: Створення Android-проєкту
        run: |
          npx cap add android
          node scripts/customize-android.mjs
          npx cap sync android

      - name: Збірка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Публікація у Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk svitlo.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest svitlo.apk \
            --title "Світло БЦ (остання збірка)" \
            --notes "Завантажте svitlo.apk на телефон і встановіть. Перед оновленням видаліть попередню версію." \
            --target "${{ github.sha }}"
